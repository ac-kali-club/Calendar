# =====================================================================
#  KALI CLUB CALENDAR — master config  (events/index.yaml)
# =====================================================================

# Where the event files live, relative to index.html. Must end "/".
base: events/

# Term boundaries — recurring events only repeat between these dates.
term:
  start: 2026-09-08
  end:   2026-12-11

# Weeks with no meetings — recurring events skip these ranges.
breaks:
  - start: 2026-10-26
    end:   2026-10-30

# Month files to preload. The app also loads events/<YYYY-MM>.yaml on
# demand as you navigate, so add a line here only to warm one up front.
# Start a month by copying events/TEMPLATE.yaml to events/<YYYY-MM>.yaml
months:
  - "2026-11"

# Filter toggles. 'name' is what you put in an event's tags: list;
# 'label' is the button text. Any tag used in an event shows up too.
tags:
  - name: meeting
    label: Meetings
  - name: ctf
    label: CTF
  - name: workshop
    label: Workshops
  - name: social
    label: Social
  - name: club
    label: Club
