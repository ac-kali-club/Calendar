# =====================================================================
#  WEEKLY / RECURRING EVENTS  (events/recurring.yaml)
# ---------------------------------------------------------------------
#  No recurring events yet. Add rules under `recurring:` — each repeats
#  weekly within the term (see index.yaml) and skips break weeks.
#
#  Example (delete the leading '#' on the block to activate):
#
#  recurring:
#    - title: Kali Club — Weekly Meet
#      weekday: wed          # mon tue wed thu fri sat sun
#      time: "17:00"
#      end_time: "18:00"
#      category: meeting      # meeting | ctf | workshop | social | club | other
#      location: T119
#      tags: [club, meeting]
# =====================================================================

