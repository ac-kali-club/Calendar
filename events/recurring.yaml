# =====================================================================
#  WEEKLY / RECURRING EVENTS  (events/recurring.yaml)
# ---------------------------------------------------------------------
#  Each rule repeats every week within the term (see index.yaml) and
#  automatically skips break weeks.
#
#  Fields:
#    title      (required)
#    weekday    mon | tue | wed | thu | fri | sat | sun   (required)
#    time       "HH:MM"   (quote it so YAML keeps the colon)
#    end_time   "HH:MM"
#    category   lecture | lab | exam | security | club | social | other
#    location   room
#    tags       [a, b]  — used by the sidebar filters
#    start/end  optional YYYY-MM-DD to limit a rule's range
# =====================================================================

